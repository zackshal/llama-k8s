name: Reviewed deployment
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full reviewed commit SHA of this repository
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Validate release identifier
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: '[[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af6834
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Install controller dependencies
        run: python3 -m pip install ansible-core==2.19.3 PyYAML==6.0.2 Jinja2==3.1.6 -r requirements-adapter.txt
      - name: Revalidate the selected release before loading deployment secrets
        run: |
          python3 -m unittest discover -s tests -v
          cd ansible
          ansible-playbook -i inventory/production/hosts.ini playbooks/site.yml --syntax-check
      - name: Prepare private controller inputs
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          INVENTORY: ${{ secrets.DEPLOY_INVENTORY }}
          DEPLOY_VARS: ${{ secrets.DEPLOY_VARS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$INVENTORY" && test -n "$DEPLOY_VARS"
          mkdir -p "$RUNNER_TEMP/llama-private" "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/llama-private/id"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$INVENTORY" > "$RUNNER_TEMP/llama-private/hosts.yml"
          printf '%s\n' "$DEPLOY_VARS" > "$RUNNER_TEMP/llama-private/vars.yml"
      - name: Apply explicit reviewed configuration
        working-directory: ansible
        run: |
          ansible-playbook -i "$RUNNER_TEMP/llama-private/hosts.yml" playbooks/site.yml \
            --private-key "$RUNNER_TEMP/llama-private/id" \
            -e "@$RUNNER_TEMP/llama-private/vars.yml"
      - name: Remove private inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/llama-private"

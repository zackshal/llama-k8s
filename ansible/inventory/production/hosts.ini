# INVENTORY FOR PRODUCTION LLM FARM

# This file defines all your VPS nodes.
# To add a new node, simply add one line under [all] and
# include it in the appropriate groups (gpu_nodes, etc.)

# [all] – every node in the farm

# Format: <alias> ansible_host=<IP> ansible_user=<user> [ansible_ssh_private_key_file=<path>]
# Example:
#   node1 ansible_host=192.168.1.10 ansible_user=root
#   node2 ansible_host=192.168.1.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/key.pem

[all]
# Main GPU nodes (where llama-server will run) 
node1 ansible_host={{ lookup('env', 'NODE1_IP') }} ansible_user=root
node2 ansible_host={{ lookup('env', 'NODE2_IP') }} ansible_user=root
# Optional CPU-only nodes (for orchestration or light tasks) 
# node3 ansible_host=192.168.1.12 ansible_user=root

# [k8s_masters] – control plane nodes for Kubernetes
[k8s_masters]
node1

# [k8s_workers] – worker nodes for Kubernetes (add them here)
[k8s_workers]
node2

# [gpu_nodes] – nodes that have NVIDIA GPU and will run the model
[gpu_nodes]
node1
node2

# [nvidia_hosts] – nodes where NVIDIA drivers must be installed
# (usually same as gpu_nodes, but you can separate if needed)
[nvidia_hosts:children]
gpu_nodes

# [llama:children] – all nodes that will serve the model
# (can be gpu_nodes + maybe some CPU-only fallback)
[llama:children]
gpu_nodes

# ADVANCED: Override variables for specific hosts
# You can create a file host_vars/<alias>.yml with custom settings.
# For example, to use a different model on node2:
#   host_vars/node2.yml:
#     model_name: "AnotherModel-Q4_K_M.gguf"

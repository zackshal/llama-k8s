# ============================================================
# Global variables – static settings (architecture-independent)
# ============================================================

# Software versions (can be overridden by env)
docker_version: "5:24.0.7-1~ubuntu.22.04~jammy"
nvidia_driver_version: "550"
cuda_version: "12.4"
k3s_version: "v1.28.8+k3s1"
kubernetes_version: "1.28.8"

# Paths
project_root: "/opt/llama-cpp"
models_host_path: "/mnt/models"

# Model discovery (can be overridden by env)
auto_convert: true
mcp_enabled: true
verbose_logging: true

# These are placeholders; they will be overridden by dynamic calculations
llama_replicas: 1
llama_memory_limit: "8Gi"
llama_cpu_limit: "4"

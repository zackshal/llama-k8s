---
- name: Reject an empty or misnamed target inventory
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Require the explicit target group
      ansible.builtin.assert:
        that:
          - groups.get('llama_nodes', []) | length > 0
        fail_msg: Define llama_nodes in a private inventory; no implicit all-host deployment.

- name: Validate explicit deployment parameters before changes
  hosts: llama_nodes
  become: true
  gather_facts: true
  roles:
    - preflight

- name: Install the explicitly selected K3s server
  hosts: k3s_server
  become: true
  serial: 1
  gather_facts: false
  roles:
    - role: k3s
      when: (llama_runtime | default('compose')) == 'k3s' and (llama_manage_k3s | default(false)) | bool

- name: Join explicitly selected K3s agents
  hosts: k3s_agents
  become: true
  serial: 1
  gather_facts: false
  roles:
    - role: k3s
      when: (llama_runtime | default('compose')) == 'k3s' and (llama_manage_k3s | default(false)) | bool

- name: Verify every intended K3s node joined and is ready
  hosts: k3s_server
  become: true
  gather_facts: false
  tasks:
    - name: Check intended nodes rather than accepting any ready cluster
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, wait, --for=condition=Ready, "node/{{ item }}", --timeout=180s]
      loop: "{{ groups['k3s_server'] + groups.get('k3s_agents', []) }}"
      changed_when: false
      when: (llama_runtime | default('compose')) == 'k3s' and (llama_manage_k3s | default(false)) | bool

- name: Deploy Compose instances independently
  hosts: llama_nodes
  become: true
  serial: 1
  gather_facts: false
  roles:
    - role: llama-deploy
      when: llama_runtime == 'compose' and llama_enable_workload | bool

- name: Deploy a private Kubernetes workload once
  hosts: k3s_server
  become: true
  serial: 1
  gather_facts: false
  roles:
    - role: llama-deploy
      when: llama_runtime == 'k3s' and llama_enable_workload | bool

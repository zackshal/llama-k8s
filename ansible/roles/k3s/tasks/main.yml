---
- name: Inspect existing K3s ownership
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/k3s
    - /etc/llama-k8s/k3s-version
    - /etc/llama-k8s/k3s-role
  register: k3s_existing

- name: Refuse adoption of another K3s installation
  ansible.builtin.assert:
    that:
      - not k3s_existing.results[0].stat.exists or (k3s_existing.results[1].stat.exists and k3s_existing.results[2].stat.exists)
    fail_msg: Existing unmanaged K3s requires a separate migration plan.

- name: Read the managed K3s version
  ansible.builtin.slurp:
    src: /etc/llama-k8s/k3s-version
  register: k3s_installed_version
  when: k3s_existing.results[1].stat.exists

- name: Refuse implicit cluster upgrades
  ansible.builtin.assert:
    that:
      - (k3s_installed_version.content | b64decode | trim) == llama_k3s_version
    fail_msg: Cluster upgrades require a separately tested backup and migration procedure.
  when: k3s_existing.results[1].stat.exists

- name: Read the managed K3s role
  ansible.builtin.slurp:
    src: /etc/llama-k8s/k3s-role
  register: k3s_installed_role
  when: k3s_existing.results[2].stat.exists

- name: Refuse implicit role changes
  ansible.builtin.assert:
    that:
      - (k3s_installed_role.content | b64decode | trim) == ('server' if inventory_hostname in groups['k3s_server'] else 'agent')
    fail_msg: Server and agent role changes require a separate migration.
  when: k3s_existing.results[2].stat.exists

- name: Install K3s host prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, iptables, iproute2, conntrack, socat]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create private configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - /etc/rancher/k3s
    - /etc/llama-k8s

- name: Fetch the reviewed K3s binary with a required checksum
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ llama_k3s_version }}/k3s"
    dest: /usr/local/bin/k3s
    checksum: "sha256:{{ llama_k3s_sha256 }}"
    owner: root
    group: root
    mode: '0755'
  notify: Restart managed K3s

- name: Store the join token outside command arguments
  ansible.builtin.copy:
    content: "{{ llama_k3s_token }}\n"
    dest: /etc/rancher/k3s/join-token
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Restart managed K3s

- name: Render explicit server or agent configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0600'
  notify: Restart managed K3s

- name: Install the owned K3s service
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/llama-k3s.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart managed K3s

- name: Record the managed role
  ansible.builtin.copy:
    content: "{{ 'server' if inventory_hostname in groups['k3s_server'] else 'agent' }}\n"
    dest: /etc/llama-k8s/k3s-role
    owner: root
    group: root
    mode: '0600'

- name: Record the managed release
  ansible.builtin.copy:
    content: "{{ llama_k3s_version }}\n"
    dest: /etc/llama-k8s/k3s-version
    owner: root
    group: root
    mode: '0600'

- name: Apply pending service changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start managed K3s
  ansible.builtin.systemd_service:
    name: llama-k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for administrative kubeconfig creation
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 180
  when: inventory_hostname in groups['k3s_server']

- name: Point local administration at the private API bind address
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, config, set-cluster, default, "--server=https://{{ llama_k3s_api_bind }}:6443", --kubeconfig=/etc/rancher/k3s/k3s.yaml]
  changed_when: false
  when: inventory_hostname in groups['k3s_server']

- name: Wait for the server API to become ready
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, --raw=/readyz]
  register: k3s_ready
  until: k3s_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  when: inventory_hostname in groups['k3s_server']

- name: Enforce private administrative kubeconfig
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    owner: root
    group: root
    mode: '0600'
  when: inventory_hostname in groups['k3s_server']

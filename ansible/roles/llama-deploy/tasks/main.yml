---
- name: Create the owned deployment directory
  ansible.builtin.file:
    path: "{{ llama_project_path }}"
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Deploy a private Compose workload
  when: llama_runtime == 'compose'
  block:
    - name: Render the Compose candidate
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ llama_project_path }}/compose.next.yaml"
        owner: root
        group: root
        mode: '0640'

    - name: Validate Compose before activation
      ansible.builtin.command:
        argv: [docker, compose, -p, llama, -f, "{{ llama_project_path }}/compose.next.yaml", config, --quiet]
      changed_when: false

    - name: Promote the validated configuration and retain the previous file
      ansible.builtin.copy:
        src: "{{ llama_project_path }}/compose.next.yaml"
        dest: "{{ llama_project_path }}/compose.yaml"
        remote_src: true
        owner: root
        group: root
        mode: '0640'
        backup: true

    - name: Pull the immutable workload image
      ansible.builtin.command:
        argv: [docker, compose, -p, llama, -f, "{{ llama_project_path }}/compose.yaml", pull]
      register: llama_pull
      changed_when: "'Downloaded newer image' in llama_pull.stdout"

    - name: Reconcile Compose without unconditional restarts
      ansible.builtin.command:
        argv: [docker, compose, -p, llama, -f, "{{ llama_project_path }}/compose.yaml", up, -d, --wait, --wait-timeout, '300']
      register: llama_up
      changed_when: "'Started' in llama_up.stderr or 'Created' in llama_up.stderr or 'Recreated' in llama_up.stderr"

    - name: Verify actual model readiness over loopback
      ansible.builtin.uri:
        url: http://127.0.0.1:8081/health
        status_code: 200
        timeout: 5
      register: llama_health
      until: llama_health.status | default(0) == 200
      retries: 60
      delay: 5

- name: Deploy a private Kubernetes workload
  when: llama_runtime == 'k3s'
  block:
    - name: Create all manifest directories
      ansible.builtin.file:
        path: "{{ llama_project_path }}/k8s/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0750'
      loop: [base, overlays/single-node, overlays/multi-node]

    - name: Render resources including ConfigMap variables
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ llama_project_path }}/k8s/base/{{ item | regex_replace('[.]j2$', '') }}"
        owner: root
        group: root
        mode: '0640'
      loop: [namespace.yaml, service.yaml, deployment.yaml.j2, network-policy.yaml, kustomization.yaml]

    - name: Validate resources using the API without saving them
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, apply, --dry-run=client, -k, "{{ llama_project_path }}/k8s/base"]
      changed_when: false

    - name: Apply the namespace first
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, apply, -f, "{{ llama_project_path }}/k8s/base/namespace.yaml"]
      register: llama_ns
      changed_when: "'created' in llama_ns.stdout or 'configured' in llama_ns.stdout"

    - name: Require a pre-provisioned model PVC in the workload namespace
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, get, pvc, "{{ llama_pvc }}", -n, llama]
      changed_when: false

    - name: Reconcile validated Kubernetes resources
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, apply, -k, "{{ llama_project_path }}/k8s/base"]
      register: llama_apply
      changed_when: "'created' in llama_apply.stdout or 'configured' in llama_apply.stdout"

    - name: Require the workload rollout to succeed
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, rollout, status, deployment/llama-server, -n, llama, --timeout=300s]
      changed_when: false

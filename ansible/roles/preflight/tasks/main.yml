---
- name: Require a dedicated supported host and explicit runtime
  ansible.builtin.assert:
    that:
      - llama_dedicated_host | bool
      - ansible_distribution in ['Debian', 'Ubuntu']
      - (ansible_distribution == 'Debian' and ansible_distribution_major_version in ['12', '13']) or (ansible_distribution == 'Ubuntu' and ansible_distribution_version in ['22.04', '24.04'])
      - ansible_architecture == 'x86_64'
      - llama_runtime in ['compose', 'k3s']
      - llama_project_path == '/opt/llama'
      - llama_models_path is match('^/[A-Za-z0-9_./-]+$')
      - "'..' not in llama_models_path.split('/')"
    fail_msg: Explicit dedicated Linux amd64 host required; auto/kubeadm are not accepted paths.

- name: Require an immutable image and bounded workload configuration
  ansible.builtin.assert:
    that:
      - llama_image is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[a-f0-9]{64}$')
      - llama_model_name is match('^[A-Za-z0-9][A-Za-z0-9._-]*[.]gguf$')
      - llama_threads | int >= 1
      - llama_threads | int <= 256
      - llama_context | int >= 128
      - llama_context | int <= 131072
      - llama_memory is match('^[1-9][0-9]*(Mi|Gi)$')
      - llama_compose_memory is match('^[1-9][0-9]*[mg]$')
      - llama_cpus | string is match('^[1-9][0-9]*([.][0-9]+)?$')
      - llama_pvc is match('^[a-z0-9][a-z0-9-]*$')
      - llama_gateway_namespace is match('^[a-z0-9][a-z0-9-]*$')
  when: llama_enable_workload | bool

- name: Require explicit K3s topology and private interface configuration
  ansible.builtin.assert:
    that:
      - llama_network_prepared | bool
      - groups.get('k3s_server', []) | length == 1
      - groups.get('k3s_server', []) | difference(groups['llama_nodes']) | length == 0
      - groups.get('k3s_agents', []) | difference(groups['llama_nodes']) | length == 0
      - groups.get('k3s_server', []) | intersect(groups.get('k3s_agents', [])) | length == 0
      - inventory_hostname in (groups.get('k3s_server', []) + groups.get('k3s_agents', []))
      - llama_k3s_node_ip | length > 0
      - llama_k3s_node_ip in ansible_all_ipv4_addresses
      - llama_k3s_node_ip is match("^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.])")
      - inventory_hostname is match("^[a-z0-9][a-z0-9.-]*$")
      - llama_k3s_flannel_iface in ansible_interfaces
      - llama_k3s_version is match('^v1[.][0-9]+[.][0-9]+[+]k3s[0-9]+$')
      - llama_k3s_sha256 is match('^[a-f0-9]{64}$')
      - llama_k3s_server_url is match('^https://[A-Za-z0-9.-]+:6443$')
  when: llama_runtime == 'k3s' and llama_manage_k3s | bool

- name: Require a private join secret
  ansible.builtin.assert:
    that:
      - llama_k3s_token is string
      - llama_k3s_token | length >= 32
      - "'\n' not in llama_k3s_token"
  no_log: true
  when: llama_runtime == 'k3s' and llama_manage_k3s | bool

- name: Validate server API bind address
  ansible.builtin.assert:
    that:
      - llama_k3s_api_bind in ansible_all_ipv4_addresses
      - llama_k3s_api_bind != '0.0.0.0'
      - llama_k3s_api_bind == llama_k3s_node_ip
  when: llama_runtime == 'k3s' and llama_manage_k3s | bool and inventory_hostname in groups['k3s_server']

- name: Require explicit admission policy version for Kubernetes workloads
  ansible.builtin.assert:
    that:
      - llama_pod_security_version is match('^v1[.][0-9]+$')
  when: llama_runtime == 'k3s' and llama_enable_workload | bool

- name: Check existing Compose plugin without installing Docker
  ansible.builtin.command: docker compose version
  changed_when: false
  when: llama_runtime == 'compose' and llama_enable_workload | bool

- name: Check existing Compose model file
  ansible.builtin.stat:
    path: "{{ llama_models_path }}/{{ llama_model_name }}"
  register: llama_model
  when: llama_runtime == 'compose' and llama_enable_workload | bool

- name: Require an existing regular GGUF file
  ansible.builtin.assert:
    that:
      - llama_model.stat.isreg | default(false)
      - not (llama_model.stat.islnk | default(false))
    fail_msg: Copy a licensed GGUF model to the configured read-only mount before deployment.
  when: llama_runtime == 'compose' and llama_enable_workload | bool

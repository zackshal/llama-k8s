---
- name: Configure journald for max compression and rotation
  template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart journald

- name: Ensure journald persists logs across reboots
  lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?Storage='
    line: 'Storage=persistent'
  notify: restart journald

- name: Enable log rotation via systemd (vacuuming)
  cron:
    name: "journald vacuum"
    minute: "0"
    hour: "3"
    job: "/usr/bin/journalctl --vacuum-size=2G"
    user: root
    state: present

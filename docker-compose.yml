name: llama-local
services:
  llama-server:
    image: ${LLAMA_IMAGE:?Set a reviewed image reference including @sha256 digest}
    command: ["-m", "/models/${MODEL_NAME:?Set one GGUF filename}", "--host", "0.0.0.0", "--port", "8081", "-ngl", "0", "-c", "2048"]
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    volumes:
      - type: bind
        source: ${MODELS_DIR:?Set an existing directory containing the model}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    ports: ["127.0.0.1:8081:8081"]
    cpus: "2"
    mem_limit: 4g
    pids_limit: 256
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
